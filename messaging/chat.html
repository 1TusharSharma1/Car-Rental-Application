<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Conversation | RentO</title>
  <link rel="stylesheet" href="./chat.css">
  <script src="../utils/db.js" defer></script>
  <script src="./chat.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header__content">
        <a href="#" class="logo">
          <img src="https://media.istockphoto.com/id/1332607862/vector/car-rental-logo-template-design.jpg?s=612x612&w=0&k=20&c=Z7HXnGff9rQIvLWgrYT0E8oge2NMlLg5v0ZB1dCe4zM=" alt="RentO Logo">
        </a>
        <nav class="nav">
          <ul class="nav__list">
          
            

          </ul>
        </nav>
        <div class="header__profile">
          <a href="../utils/userDashboard.html" class="profile__link">
            <img src="https://photosking.net/wp-content/uploads/2024/05/no-dp-pic_23.webp" alt="User Profile" class="profile__icon">
            <span class="profile__text">Profile</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="chat">
    <button id="backToConversationsBtn" class="btn btn--secondary" style="margin-left: 1rem;">
      Back to Conversations
    </button>
    <div class="container chat-container">
      
      <div class="chat-header" id="chatHeader">
      </div>
      <div class="messages-container" id="messagesContainer">
      </div>
      <form id="messageForm" class="message-form">
        <input type="text" id="messageInput" placeholder="Type your message..." required>
        <input type="file" id="attachmentInput" accept="image/*">
        <button type="submit" class="btn btn--primary">Send</button>
      </form>
  
    </div>
  </main>

</body>
</html>
