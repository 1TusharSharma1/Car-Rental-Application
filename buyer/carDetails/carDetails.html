<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Details | RentO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="carDetails.css" />
    <script src="../../utils/db.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="./carDetails.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__content">
          <a href="../homePage/buyerHomePage.html" class="logo">
            <img src="https://media.istockphoto.com/id/1332607862/vector/car-rental-logo-template-design.jpg?s=612x612&w=0&k=20&c=Z7HXnGff9rQIvLWgrYT0E8oge2NMlLg5v0ZB1dCe4zM=" alt="RentO Logo" />
          </a>
          <nav class="nav">
            <ul class="nav__list">
              <li><a href="../homePage/buyerHomePage.html" class="nav__link">Browse Cars</a></li>
              <li><a href="../bookings/buyerBookings.html" class="nav__link">Your Bookings</a></li>
              <li><a href="../../messaging/conversations.html" class="nav__link">Messages</a></li>
            </ul>
          </nav>
          <div class="header__profile">
            <a href="../../utils/userDashboard.html" class="profile__link">
              <img src="https://photosking.net/wp-content/uploads/2024/05/no-dp-pic_23.webp" alt="Profile" class="profile__icon" />
              <span class="profile__text">Profile</span>
            </a>
          </div>
        </div>
      </div>
    </header>
    <main class="car-details">
      <div class="container car-details__content">
        <div class="car-images">
          <img id="mainCarImage" src="https://via.placeholder.com/400" alt="Car Image" />
          <div class="thumbnail-container" id="carThumbnails"></div>
        </div>
        <div class="car-info">
          <h1 id="carTitle">Car Model</h1>
          <p><strong>Location:</strong> <span id="carLocation"></span></p>
          <p><strong>Price:</strong> Rs <span id="carPrice"></span> /day</p>
          <p><strong>Availability:</strong> <span id="carAvailability"></span></p>
          <p><strong>Features:</strong> <span id="carFeatures"></span></p>
        </div>
        <div class="bidding-info">
          <h2>Bidding Details</h2>
          <p><strong>Highest Bid:</strong> Rs <span id="highestBid">No bids yet</span></p>
          <div class="bidding-buttons">
            <button id="placeBidBtn" class="btn btn--primary">Place Bid</button>
            <button id="chatOwnerBtn" class="btn btn--secondary">Chat With Owner</button>
          </div>
        </div>
      </div>
    </main>

    <div id="bidModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Place Your Bid</h2>
        <form id="bidForm">
          <input type="hidden" id="vehicleId" />
          <div class="form-group">
            <label for="bidAmount">Bid Amount (Rs):</label>
            <input type="number" id="bidAmount" required min="1" />
            <p id="minBidAmount">Minimum Bid: Rs 0</p>
          </div>
          <div class="form-group">
            <label for="bidStartDate">Booking Start Date:</label>
            <input type="text" id="bidStartDate" required />
          </div>
          <div class="form-group">
            <label for="bidEndDate">Booking End Date:</label>
            <input type="text" id="bidEndDate" required />
          </div>
          <div class="form-group" id="dlInputContainer">
            <label for="driverLicense">Driver License Details:</label>
            <input type="text" id="driverLicense" placeholder="Enter your DL number" />
          </div>
          <button type="submit" class="btn btn--primary">Submit Bid</button>
        </form>
      </div>
    </div>
  </body>
</html>
